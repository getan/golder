# Builds the double-clickable Golder GUI packages with MyGo's own CLI: a .app
# and .dmg on macOS, an .exe and NSIS installer on Windows, and a tarball with
# install.sh, a .deb and a PKGBUILD on Linux.
#
# The desktop binary contains the Agent runtime in-process. It deliberately does
# not bundle the full `golder` CLI or tuios workspace renderer.
name: gui

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Notary processing can take longer than the build itself; leave room for
    # slow Apple responses without allowing a runner to wait indefinitely.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, platform: "darwin/arm64", kind: macos }
          - { name: windows, os: windows-2022, platform: "windows/amd64", kind: windows }
          - { name: linux, os: ubuntu-22.04, platform: "linux/amd64,linux/arm64", kind: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify offline diagram renderers
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-wasip1
          cargo +1.96.0 build --manifest-path gui/svgwasm/Cargo.toml --locked \
            --release --target wasm32-wasip1 --target-dir "$RUNNER_TEMP/golder-svg-wasm"
          mkdir -p gui/resources/renderers
          go run ./gui/tools/packwasm -in "$RUNNER_TEMP/golder-svg-wasm/wasm32-wasip1/release/golder-svgwasm.wasm" -out gui/resources/renderers/svg.wasm.gz
          cargo +1.96.0 metadata --manifest-path gui/svgwasm/Cargo.toml --locked --offline \
            --filter-platform wasm32-wasip1 --format-version 1 | go run ./gui/tools/svglicenses
          go run ./gui/tools/fetchmermaid -out "$RUNNER_TEMP/golder-mermaid.wasm"
          go run ./gui/tools/preparemermaid -out "$RUNNER_TEMP/golder-mermaid-audit"
          cargo +1.96.0 metadata --manifest-path "$RUNNER_TEMP/golder-mermaid-audit/Cargo.toml" --locked \
            --filter-platform wasm32-unknown-unknown --format-version 1 | go run ./gui/tools/svglicenses -out gui/resources/renderers-LICENSE.mermaid-deps.txt
          go run ./gui/tools/packwasm -in "$RUNNER_TEMP/golder-mermaid.wasm" -out gui/resources/renderers/mermaid.wasm.gz
          GOLDER_TEST_SVG_WASM="$RUNNER_TEMP/golder-svg-wasm/wasm32-wasip1/release/golder-svgwasm.wasm" \
          GOLDER_TEST_MERMAID_WASM="$RUNNER_TEMP/golder-mermaid.wasm" \
            go test ./gui/svgwasm ./gui/mermaidwasm ./gui/mygoui -run 'Test(RenderPinnedSourceWASM|PinnedUpstreamModule|RichPreviewWithPinnedModules)' -count=1

      - name: Set the app version from the release tag
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-}"
          version=0.0.0
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then version="${ref#v}"; fi
          tmp="$RUNNER_TEMP/mygo.json"
          jq --arg version "$version" '.version = $version' gui/mygo.json > "$tmp"
          mv "$tmp" gui/mygo.json
          echo "GUI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the first-party Lark helper
        shell: bash
        run: |
          set -euo pipefail
          build_lark() {
            local goos=$1 arch=$2 dir=$3 name=golder-lark
            if [[ "$goos" == windows ]]; then name+=.exe; fi
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags "-s -w" \
              -o "$dir/$name" ./extension/plugins/lark/cmd/golder-lark
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$dir/$name" > "$dir/$name.sha256"
            else
              shasum -a 256 "$dir/$name" > "$dir/$name.sha256"
            fi
          }
          case "${{ matrix.name }}" in
            macos-arm64) build_lark darwin arm64 gui/resources/darwin-arm64/extensions/lark ;;
            windows) build_lark windows amd64 gui/resources/windows-amd64/extensions/lark ;;
            linux)
              build_lark linux amd64 gui/resources/linux-amd64/extensions/lark
              build_lark linux arm64 gui/resources/linux-arm64/extensions/lark
              ;;
          esac

      - name: Check the GUI dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          if go list -deps ./gui/cmd/golder-gui | grep -q 'github.com/getan/tuios-mini'; then
            echo "the GUI must not link tuios-mini" >&2
            exit 1
          fi

      - name: Test macOS finalization
        if: matrix.kind == 'macos'
        run: go test -count=1 ./gui/tools/finalizemac

      - name: Fetch verified terminal libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # MyGo verifies these same pinned hashes when it packages the app.
          # The GitHub API avoids release-download URLs returning 504 and puts
          # each verified library in the cache MyGo reads on this platform.
          plugin_dir=$(go list -f '{{.Dir}}' github.com/egoist/mygo/plugins/terminal)
          go run ./gui/tools/fetchnative -manifest "$plugin_dir/mygo-plugin.json" -platform "${{ matrix.platform }}"

      - name: Check macOS release credentials
        if: matrix.kind == 'macos'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          names=(MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID)
          present=0
          for name in "${names[@]}"; do
            [[ -z "${!name:-}" ]] || present=$((present + 1))
          done
          if [[ "$present" != 0 && "$present" != "${#names[@]}" ]] || \
             [[ "$GITHUB_REF_TYPE" == tag && "$present" != "${#names[@]}" ]]; then
            echo '::error::All six macOS signing and notarization secrets are required for a release (and when any one is configured).'
            exit 1
          fi

      - name: Import the macOS signing certificate
        if: matrix.kind == 'macos'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12:-}" ]]; then
            echo "no signing certificate in secrets; the app will be signed ad hoc"
            exit 0
          fi
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/golder.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/golder.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/golder.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/golder.keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$RUNNER_TEMP/golder.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/golder.keychain" $(security list-keychains -d user | tr -d '"')

      - name: Store the notary credentials
        if: matrix.kind == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "no notary credentials in secrets; notarization will be skipped"
            exit 0
          fi
          xcrun notarytool store-credentials golder-notary \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Build the app
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MYGO_LDFLAGS: >-
            -X main.version=${{ env.GUI_VERSION }}
            -X main.commit=${{ github.sha }}
            -X main.date=${{ github.event.repository.updated_at }}
        run: |
          set -euo pipefail
          # Finalize the signed helper checksum before submitting the DMG.
          # Other platforms must also opt out of gui/mygo.json's notarization.
          args=(-platform "${{ matrix.platform }}" -skip-notarize)
          if [[ "${{ matrix.kind }}" == "macos" && -n "${MACOS_SIGNING_IDENTITY:-}" && -n "${APPLE_ID:-}" ]]; then
            args+=(-sign "$MACOS_SIGNING_IDENTITY")
          elif [[ "${{ matrix.kind }}" == "macos" ]]; then
            args+=(-sign -) # ad hoc: runs on the machine that built it
          fi
          printf 'mygo build %s\n' "${args[*]}"
          cd gui
          go run ./tools/mkicon -o resources/icon.png
          # The macOS Computer Use backend links the native Accessibility and
          # ScreenCaptureKit frameworks. MyGo otherwise defaults CGO to zero.
          if [[ "${{ matrix.kind }}" == "macos" ]]; then
            export CGO_ENABLED=1
            # The runner's OS is newer than the oldest supported system. The
            # plist setting alone does not set the Mach-O deployment target.
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          go run github.com/egoist/mygo/cmd/mygo build "${args[@]}"

      - name: Finalize and notarize macOS package
        if: matrix.kind == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=$(find gui/build -type d -name '*.app' -print -quit)
          dmg=$(find gui/build -type f -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          bash gui/tools/finalizemac/finalize.sh "$app" "$dmg" "${MACOS_SIGNING_IDENTITY:--}"

      - name: Verify macOS signing and notarization
        if: matrix.kind == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo 'Manual ad-hoc build: no notarization to verify.'
            exit 0
          fi
          app=$(find gui/build -type d -name '*.app' -print -quit)
          dmg=$(find gui/build -type f -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --verbose=2 "$dmg"
          signature=$(codesign -dvv "$app" 2>&1)
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          printf '%s\n' "$signature" | grep -F 'Authority=Developer ID Application:'
          xcrun stapler validate "$dmg"

      - name: List the artifacts
        shell: bash
        run: find gui/build -maxdepth 2 -type f | sort | head -60

      - name: Enforce the desktop bundle boundary
        shell: bash
        run: |
          set -euo pipefail
          if find gui/build -type f -path '*/Resources/bin/golder*' -print -quit | grep -q .; then
            echo "the GUI bundle contains a full golder CLI" >&2
            exit 1
          fi
          if find gui/build -type f \( -iname '*chromium*' -o -iname 'chrome' -o -iname 'chrome.exe' \) -print -quit | grep -q .; then
            echo "the GUI bundle must not contain Chromium" >&2
            exit 1
          fi
          if ! find gui/build -type f -path '*/extensions/lark/golder-lark*' ! -name '*.sha256' -print -quit | grep -q .; then
            echo "the GUI bundle is missing the first-party golder-lark helper" >&2
            exit 1
          fi
          if [[ "${{ matrix.kind }}" == "macos" ]]; then
            app=$(find gui/build -type d -name '*.app' -print -quit)
            helper="$app/Contents/Resources/extensions/lark/golder-lark"
            expected=$(awk 'NR == 1 {print $1}' "$helper.sha256")
            actual=$(shasum -a 256 "$helper" | awk '{print $1}')
            if [[ "$expected" != "$actual" ]]; then
              echo '::error::The bundled Lark helper no longer matches its checksum after packaging/signing.'
              exit 1
            fi
            exe="$app/Contents/MacOS/Golder GUI"
            if ! go version -m "$exe" | grep -q 'CGO_ENABLED=1'; then
              echo "the macOS GUI was built without the Computer Use backend" >&2
              exit 1
            fi
            minos=$(xcrun vtool -show-build "$exe" | awk '$1 == "minos" {print $2}')
            plist_min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
            echo "macOS minimum: Mach-O ${minos}, Info.plist ${plist_min}"
            if [[ "$minos" != "14.0" || "$plist_min" != "14.0" ]]; then
              echo "the macOS GUI must target macOS 14.0 in both Mach-O and Info.plist" >&2
              exit 1
            fi
            # A bundled helper or library can independently prevent launch on
            # the supported OS, even when the main executable is compatible.
            while IFS= read -r -d '' binary; do
              if ! file -b "$binary" | grep -q '^Mach-O'; then
                continue
              fi
              build_info=$(xcrun vtool -show-build "$binary")
              versions=$(printf '%s\n' "$build_info" | awk '$1 == "minos" {print $2}')
              if [[ -z "$versions" ]]; then
                echo "cannot determine the macOS minimum for $binary" >&2
                exit 1
              fi
              while IFS= read -r version; do
                if ! awk -v v="$version" 'BEGIN { n = split(v, p, "."); if (n < 2 || n > 3 || p[1] !~ /^[0-9]+$/ || p[2] !~ /^[0-9]+$/ || (n == 3 && p[3] !~ /^[0-9]+$/) || p[1] > 14 || (p[1] == 14 && (p[2] > 0 || p[3] > 0))) exit 1 }'; then
                  echo "$binary requires macOS $version; expected at most 14.0" >&2
                  exit 1
                fi
              done < <(printf '%s\n' "$versions")
            done < <(find "$app" -type f -print0)
            mib=$(du -sm "$app" | awk '{print $1}')
            echo "installed app size: ${mib} MiB"
            # Keep a bounded budget for the offline renderers and Lark helper.
            test "$mib" -lt 60
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: golder-gui-${{ matrix.name }}
          path: |
            gui/build/**/*.dmg
            gui/build/**/*.app/**
            gui/build/**/*.exe
            gui/build/**/*.tar.gz
            gui/build/**/*.deb
            gui/build/**/PKGBUILD
          if-no-files-found: error
