# 在 push 到 master 及所有 PR 上运行格式检查、构建、vet 与测试。
name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -timeout 6m is deliberately tighter than Go's 10m default: the TUI
        # suite once crept to 566s (quadratic wrap in the expanded sub-agent
        # view) and stayed green for days, 34s short of the default limit.
        # A tighter ceiling turns the next such regression into a red build.
        run: go test -race -timeout 6m ./...
