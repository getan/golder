# 每次 push 到 master、PR 或手动触发时，构建 macOS 与 Linux 的二进制
# （amd64 + arm64），打包进 release/ 目录并作为 workflow artifact 上传。
# 打 tag 的正式发布仍由 release.yml 的 goreleaser 流程负责（含 GitHub Release）。
name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    runs-on: ${{ matrix.os == 'darwin' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.os == 'darwin' && '1' || '0' }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CGO_CFLAGS: ${{ matrix.os == 'darwin' && '-mmacosx-version-min=14.0' || '' }}
          CGO_LDFLAGS: ${{ matrix.os == 'darwin' && '-mmacosx-version-min=14.0' || '' }}
        run: |
          set -euo pipefail
          version="$(git describe --tags --always --dirty | sed 's/^v//')"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          case "$GOOS" in
            darwin) osname=Darwin ;;
            linux)  osname=Linux ;;
            *) echo "unexpected GOOS $GOOS" >&2; exit 1 ;;
          esac
          case "$GOARCH" in
            amd64) archname=x86_64 ;;
            arm64) archname=arm64 ;;
            *) echo "unexpected GOARCH $GOARCH" >&2; exit 1 ;;
          esac
          mkdir -p release/staging
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o release/staging/golder ./cmd/golder
          cp README.md README.zh-CN.md LICENSE THIRD_PARTY_LICENSES.md release/staging/
          tar -czf "release/golder_${version}_${osname}_${archname}.tar.gz" \
            -C release/staging golder README.md README.zh-CN.md LICENSE THIRD_PARTY_LICENSES.md
          rm -rf release/staging
          ls -l release/

      - name: Upload ${{ matrix.os }}/${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: golder-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk"
          sdkmanager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$sdkmanager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-android-app.sh --no-install
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk golder-android.apk
          sha256sum golder-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: golder-android-apk
          path: golder-android.apk
          if-no-files-found: error

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v8
        with:
          pattern: golder-*
          path: release
          merge-multiple: true

      - name: Generate checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum golder_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload release directory
        uses: actions/upload-artifact@v7
        with:
          name: golder-release
          path: release/
          if-no-files-found: error
